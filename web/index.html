<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <script>
    // Caminhos relativos funcionam na raiz local e em /debate-mentirometro/.
    (function () {
      var path = location.pathname
      if (!/\/$/.test(path) && !/\.[a-z0-9]+$/i.test(path.split('/').pop() || '')) path += '/'
      else if (!/\/$/.test(path)) path = path.replace(/[^/]*$/, '')
      var base = document.createElement('base')
      base.href = path
      document.currentScript.after(base)
    })()
  </script>
