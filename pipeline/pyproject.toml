[project]
name = "placar-pipeline"
version = "0.1.0"
description = "Pipeline local do Placar da Verdade: áudio, checagem e placar.json"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
placar = "placar.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["placar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
